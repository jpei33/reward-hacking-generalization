[project]
name = "reward-hacking-generalization"
version = "0.1.0"
description = "Does SFT on leaked-answer recovery generalize to novel shortcuts? A four-condition study on MiMo environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tinker",            # Thinking Machines LoRA SFT + sampling
    "modal",             # sandboxed agent rollouts for evals
    "datasets",          # load the MiMo / FineEnvs Harbor data
    "huggingface_hub",   # hf download
    "pandas",
    "pyarrow",           # read the parquet task files (leak vector lives here)
    "matplotlib",        # Day 6 figures
    "pyyaml",            # condition configs
]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
